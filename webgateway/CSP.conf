# CSP config file

CSPModulePath "${ISC_PACKAGE_INSTALLDIR}/bin/"
CSPConfigPath "${ISC_PACKAGE_INSTALLDIR}/bin/"

# Serve everything via Web Gateway
<Location />
    CSP On
</Location>

# More-specific match must come AFTER the catch-all so it wins
Alias /dse/agent/static /var/www/dse-agent-static

<Directory /var/www/dse-agent-static>
    Options -Indexes
    Require all granted
</Directory>

<Location /dse/agent/static>
    CSP Off
    SetHandler default-handler
</Location>

<Directory />
    Options MultiViews FollowSymLinks
    AllowOverride None
    Require all granted
    <FilesMatch "\.(log|ini|pid|exe|so)$">
        Require all denied
    </FilesMatch>
</Directory>

LoadModule ssl_module /usr/lib/apache2/modules/mod_ssl.so
<VirtualHost *:443>
SSLEngine on
SSLCertificateFile "/opt/cert/cert.pem"
SSLCertificateKeyFile "/opt/cert/private.key"
</VirtualHost>

# Redirect Help links
Redirect /csp/docbook/ https://docs.intersystems.com/irisforhealthlatest/csp/docbook/DocBook.UI.Page.cls
